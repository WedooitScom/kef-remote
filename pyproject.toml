[project]
name = "kef-remote"
version = "0.1.0"
description = "Client local (FastAPI + PWA) pour piloter des enceintes KEF LS50 Wireless II / LSX II / LS60 via pykefcontrol."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# pykefcontrol demande >=3.10 ; on cible 3.12/3.13 (épinglé dans .python-version).
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "pykefcontrol>=0.9.3,<0.10",
    "uvicorn[standard]>=0.30",
    "zeroconf>=0.130",
]

[project.scripts]
kef = "app.main:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
